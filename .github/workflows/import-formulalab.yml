name: Import and publish FormulaLab

on:
  push:
    paths:
      - FormulaLab_GitHub_Ready.zip
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  import-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract FormulaLab website
        run: |
          test -f FormulaLab_GitHub_Ready.zip || { echo "Upload FormulaLab_GitHub_Ready.zip first."; exit 1; }
          unzip -o FormulaLab_GitHub_Ready.zip -d .
          test -s index.html
          test -s index-en.html
          test -s styles.css
          test -s app.js
          test -s data.js
          test -s products.json
          for avatar in welcome happy thinking explaining warning love; do
            test -s "assets/avatars/$avatar.png"
          done

      - name: Validate product comparison logic
        run: node test_core.js

      - name: Commit unpacked files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: import website, catalog, and six mascot illustrations"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static website to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
